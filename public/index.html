<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grok Bot • Pairing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    .logo {
      font-size: 48px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(to right, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.sub {
      color: #a1a1aa;
      font-size: 14px;
      margin-bottom: 28px;
    }
    input {
      width: 100%;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
      transition: border 0.2s;
    }
    input:focus { border-color: #8b5cf6; }
    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    button:hover { transform: translateY(-2px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .code-box {
      margin-top: 28px;
      padding: 20px;
      background: rgba(0,0,0,0.4);
      border-radius: 16px;
      display: none;
    }
    .code-box.show { display: block; animation: fadeIn 0.4s; }
    .code {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #34d399;
      margin: 12px 0;
      font-family: monospace;
    }
    .hint {
      font-size: 13px;
      color: #a1a1aa;
      line-height: 1.5;
    }
    .status {
      margin-top: 20px;
      font-size: 13px;
      color: #a1a1aa;
    }
    .error { color: #f87171; margin-top: 12px; font-size: 14px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🤖</div>
    <h1>Grok Bot</h1>
    <p class="sub">Pairing Session Dashboard</p>

    <input type="text" id="number" placeholder="Phone number (e.g. 2349166265317)" />
    <button id="btn" onclick="getCode()">Generate Pairing Code</button>

    <div id="error" class="error"></div>

    <div class="code-box" id="codeBox">
      <div class="hint">Your 8-digit pairing code</div>
      <div class="code" id="code">--------</div>
      <div class="hint">
        Open WhatsApp → Settings → Linked Devices<br>
        → Link a Device → <b>Link with phone number</b><br>
        and enter the code above.
      </div>
    </div>

    <div class="status" id="status">Ready</div>
  </div>

  <script>
    async function getCode() {
      const number = document.getElementById("number").value.trim()
      const btn = document.getElementById("btn")
      const errorEl = document.getElementById("error")
      const codeBox = document.getElementById("codeBox")
      const status = document.getElementById("status")

      errorEl.textContent = ""
      codeBox.classList.remove("show")

      if (!number) {
        errorEl.textContent = "Please enter a phone number"
        return
      }

      btn.disabled = true
      btn.textContent = "Generating..."
      status.textContent = "Requesting code from WhatsApp..."

      try {
        const res = await fetch("/pair", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ number })
        })
        const data = await res.json()

        if (data.success) {
          document.getElementById("code").textContent = data.code
          codeBox.classList.add("show")
          status.textContent = "Code generated • Enter it on your phone"
        } else {
          errorEl.textContent = data.error || "Failed to generate code"
          status.textContent = "Error"
        }
      } catch (err) {
        errorEl.textContent = "Server error. Make sure the bot is running."
        status.textContent = "Connection failed"
      }

      btn.disabled = false
      btn.textContent = "Generate Pairing Code"
    }

    // Check status every 8s
    setInterval(async () => {
      try {
        const res = await fetch("/status")
        const data = await res.json()
        if (data.connected) {
          document.getElementById("status").textContent = "✅ Bot is online!"
          document.getElementById("status").style.color = "#34d399"
        }
      } catch {}
    }, 8000)
  </script>
</body>
</html>
